name: Host checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libfdt development package
        run: sudo apt-get update && sudo apt-get install -y libfdt-dev
      - name: Build CLI and test planner
        run: make -C user CFLAGS='-O2 -Wall -Wextra -Werror' quest-el1 test
      - name: Test production handoff and memory validation with stubs
        run: |
          for test in tests/test_*.py; do python3 -I "$test"; done
      - name: Check scripts
        run: |
          bash -n scripts/build-module.sh scripts/build-user-arm64.sh \
                 scripts/build-initramfs.sh
          python3 -m py_compile scripts/prepare-image.py tests/test_*.py \
                 scripts/stock-symvers.py scripts/check-module-abi.py

  cli-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu file
      - name: Fetch libfdt (dtc 1.7.2)
        run: |
          curl -fsSL https://github.com/dgibson/dtc/archive/refs/tags/v1.7.2.tar.gz | tar -xz -C "$RUNNER_TEMP"
      - name: Build static quest-el1 for the headset
        run: scripts/build-user-arm64.sh "$RUNNER_TEMP/dtc-1.7.2"
      - name: Build the target's first-boot initramfs
        run: |
          make -C user CC=aarch64-linux-gnu-gcc \
            CFLAGS='-O2 -Wall -Wextra -Werror -static' handoff-init
          file user/handoff-init
          scripts/build-initramfs.sh user/handoff-init build/bin/handoff-initramfs.cpio.gz
          sha256sum build/bin/handoff-initramfs.cpio.gz
      - uses: actions/upload-artifact@v4
        with:
          name: quest-el1-aarch64
          path: |
            build/bin/quest-el1-aarch64
            build/bin/handoff-initramfs.cpio.gz
